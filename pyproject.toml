[project]
name = "wikinggruppen-mcp"
version = "0.1.0"
description = "MCP server and knowledge base for the Wikinggruppen webshop API: methods, behaviour, recipes, optional live calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wikinggruppen-mcp = "wikinggruppen_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikinggruppen_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
